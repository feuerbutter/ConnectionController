name: macOS
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build-and-check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Core checks
        run: swift run CambridgeVPNAutoCoreChecks
      - name: Release app and router
        run: swift build -c release
      - name: Python syntax
        run: |
          python3 - <<'PY'
          import ast
          from pathlib import Path
          for path in Path('scripts').glob('*.py'):
              ast.parse(path.read_text(), filename=str(path))
          PY
      - name: Shell syntax
        run: zsh -n scripts/install.sh scripts/archive-installation.sh
